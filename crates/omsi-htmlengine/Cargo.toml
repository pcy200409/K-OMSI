[package]
name = "omsi-htmlengine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The built-in [htmltexture] backend: a small HTML/CSS/JavaScript engine drawing a page's pixels (registered with omsi-sim's htmltex by the game)"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-sim = { path = "../omsi-sim" }
ab_glyph.workspace = true
log.workspace = true
serde_json.workspace = true
ureq.workspace = true
omsi-texture = { path = "../omsi-texture" }
base64 = "0.22"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
