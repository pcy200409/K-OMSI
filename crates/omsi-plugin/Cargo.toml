[package]
name = "omsi-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OMSI plugins: the .opl files of the plugins folder and their DLLs, driven as OMSI drives them"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
libloading = "0.9"
log.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
mlua = { version = "0.10", features = ["lua54", "vendored"] }
wasmi = "2"
# K-OMSI OBIS edition only (`--features obis`): omsi.ws / omsi.obis
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
ureq = { workspace = true, optional = true }
oop-format = { git = "https://github.com/openOMSI-org/openOMSI-Development-Tools", rev = "496d9bd" }

[features]
# K-OMSI's OBIS edition: the plugins may listen to OBIS and send the player's bus to it
obis = ["dep:tungstenite", "dep:ureq"]

[[bin]]
name = "omsi-plugin-host"
path = "src/bin/omsi-plugin-host.rs"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
